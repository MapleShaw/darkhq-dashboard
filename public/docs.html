<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卷宗 · 老巢</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail" data-active="docs"></aside>

  <div>
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">老巢</h1>
        <span class="topbar-sub">话事厅 · Darknet Operations</span>
      </div>
      <div class="topbar-right"><span class="clock" id="clock">—</span></div>
    </header>

    <main class="page">
      <div class="page-header">
        <div>
          <h2 class="page-title">卷宗</h2>
          <p class="page-desc">兄弟们整理的档案与每日聊天底</p>
        </div>
      </div>

      <div class="tabs">
        <button class="tab"        data-tab="docs"   onclick="switchTab('docs',this)">档案</button>
        <button class="tab active" data-tab="memory" onclick="switchTab('memory',this)">聊天底</button>
      </div>

      <!-- bot 过滤，仅对 docs 生效 -->
      <div class="filters" id="bot-filter-bar" style="display:none">
        <button class="filter-btn active" data-bot="all"       onclick="applyBotFilter('all',this)">全部兄弟</button>
        <button class="filter-btn"        data-bot="main"      onclick="applyBotFilter('main',this)">🏴 老大</button>
        <button class="filter-btn"        data-bot="content"   onclick="applyBotFilter('content',this)">🧠 洗脑专家</button>
        <button class="filter-btn"        data-bot="tech"      onclick="applyBotFilter('tech',this)">⌨️ 键盘杀手</button>
        <button class="filter-btn"        data-bot="intel"     onclick="applyBotFilter('intel',this)">🕵 线人</button>
        <button class="filter-btn"        data-bot="assistant" onclick="applyBotFilter('assistant',this)">🤖 跟班</button>
      </div>

      <div class="doc-layout">
        <aside class="doc-list" id="doc-list">
          <div class="loading">载入中…</div>
        </aside>
        <section class="doc-viewer" id="doc-viewer">
          <div class="doc-viewer-empty">← 点左边嘅卷宗睇内容</div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="rail.js"></script>
<script>
function updateClock(){const n=new Date();const e=document.getElementById('clock');if(e)e.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
setInterval(updateClock,1000);updateClock();

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtTime(iso){if(!iso)return'—';try{const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}catch(e){return iso;}}
function fmtSize(bytes){if(!bytes)return'—';if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/1024/1024).toFixed(2)+' MB';}

const BOT_NAMES={main:'老大',content:'洗脑专家',tech:'键盘杀手',intel:'线人',assistant:'跟班'};
const BOT_EMOJI={main:'🏴',content:'🧠',tech:'⌨️',intel:'🕵',assistant:'🤖'};

let currentTab='memory';
let currentBot='all';
let currentDocId=null;

// ── Minimal markdown renderer（够用即可，不引外部库）──────
function renderMarkdown(src){
  if(!src) return '';
  let html = esc(src);
  // fenced code block
  html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (m,lang,code)=>`<pre><code>${code}</code></pre>`);
  // headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>')
             .replace(/^## (.+)$/gm, '<h2>$1</h2>')
             .replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // bold / italic
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
             .replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  // inline code
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // blockquote
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // horizontal rule
  html = html.replace(/^---$/gm, '<hr>');
  // unordered / ordered list (simple)
  html = html.replace(/(^|\n)((?:- .+(?:\n|$))+)/g, (m,pre,block)=>{
    const items=block.trim().split('\n').map(l=>`<li>${l.replace(/^- /,'')}</li>`).join('');
    return `${pre}<ul>${items}</ul>`;
  });
  html = html.replace(/(^|\n)((?:\d+\. .+(?:\n|$))+)/g, (m,pre,block)=>{
    const items=block.trim().split('\n').map(l=>`<li>${l.replace(/^\d+\. /,'')}</li>`).join('');
    return `${pre}<ol>${items}</ol>`;
  });
  // table (very simple: | a | b |\n|---|---| ...)
  html = html.replace(/(^|\n)\|(.+?)\|\n\|([-: |]+)\|\n((?:\|.+?\|\n?)+)/g, (m,pre,head,align,body)=>{
    const heads=head.split('|').map(s=>`<th>${s.trim()}</th>`).join('');
    const rows=body.trim().split('\n').map(row=>{
      const cells=row.replace(/^\||\|$/g,'').split('|').map(s=>`<td>${s.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `${pre}<table style="width:100%;border-collapse:collapse;margin:0.8rem 0;font-size:0.85rem"><thead style="background:var(--bg-3)"><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  // paragraphs (剩余纯文本行)
  html = html.split(/\n\n+/).map(p=>{
    if(/^<(h\d|ul|ol|pre|blockquote|table|hr)/i.test(p.trim()))return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('\n');
  return html;
}

async function loadDocs(){
  const list=document.getElementById('doc-list');
  list.innerHTML='<div class="loading">载入中…</div>';

  const filterBar=document.getElementById('bot-filter-bar');
  filterBar.style.display = currentTab==='docs' ? '' : 'none';

  try{
    const qs=`type=${currentTab}` + (currentTab==='docs' && currentBot!=='all' ? `&bot=${currentBot}` : '');
    const data=await fetch(`/api/docs?${qs}`).then(r=>r.json());
    const docs=data.docs||[];
    if(!docs.length){
      list.innerHTML='<div class="empty"><span class="empty-icon">📄</span>暂无卷宗</div>';
      return;
    }
    list.innerHTML=docs.map(d=>`
      <div class="doc-item ${d.id===currentDocId?'active':''}" onclick="openDoc('${esc(d.id)}',this)">
        <div class="doc-item-title">${esc(d.title)}</div>
        <div class="doc-item-meta">
          <span>${fmtTime(d.createdAt)}</span>
          <span>${fmtSize(d.size)}</span>
        </div>
        ${d.botId?`<div class="doc-item-bot">${BOT_EMOJI[d.botId]||'●'} ${esc(BOT_NAMES[d.botId]||d.botId)}</div>`:''}
      </div>`).join('');

    // 自动打开第一条
    if(!currentDocId && docs[0]){
      openDoc(docs[0].id, list.querySelector('.doc-item'));
    }
  }catch(e){
    list.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>${esc(e.message)}</div>`;
  }
}

async function openDoc(id, el){
  currentDocId=id;
  document.querySelectorAll('.doc-item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');

  const viewer=document.getElementById('doc-viewer');
  viewer.innerHTML='<div class="loading">载入文档…</div>';
  try{
    const data=await fetch(`/api/docs/${encodeURIComponent(id)}`).then(r=>r.json());
    if(!data.ok){
      viewer.innerHTML=`<div class="doc-viewer-empty">${esc(data.error||'文档读取失败')}</div>`;
      return;
    }
    // 找到当前文档元信息
    const item=document.querySelector(`.doc-item.active .doc-item-title`);
    const title=item?item.textContent:id;
    const metaEl=document.querySelector(`.doc-item.active .doc-item-meta`);
    const metaTxt=metaEl?metaEl.textContent.trim():'';
    const botEl=document.querySelector(`.doc-item.active .doc-item-bot`);
    const botTxt=botEl?botEl.textContent.trim():'';

    viewer.innerHTML=`
      <div class="doc-viewer-header">
        <div>
          <div class="doc-viewer-title">${esc(title)}</div>
          <div class="doc-viewer-meta">
            ${botTxt?`<span>${esc(botTxt)}</span>`:''}
            <span>${esc(metaTxt)}</span>
          </div>
        </div>
      </div>
      <div class="doc-viewer-body">${renderMarkdown(data.body)}</div>`;
  }catch(e){
    viewer.innerHTML=`<div class="doc-viewer-empty">加载失败：${esc(e.message)}</div>`;
  }
}

function switchTab(tab,btn){
  currentTab=tab;
  currentDocId=null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('doc-viewer').innerHTML='<div class="doc-viewer-empty">← 点左边嘅卷宗睇内容</div>';
  loadDocs();
}

function applyBotFilter(bot,btn){
  currentBot=bot;
  currentDocId=null;
  document.querySelectorAll('#bot-filter-bar .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadDocs();
}

// URL 参数支持：/docs.html?bot=content → 默认切到整理文档并过滤该 bot
(function bootstrap(){
  const params=new URLSearchParams(location.search);
  const botParam=params.get('bot');
  if(botParam){
    currentTab='docs';
    currentBot=botParam;
    document.querySelectorAll('.tab').forEach(t=>{
      t.classList.toggle('active', t.dataset.tab==='docs');
    });
    document.querySelectorAll('#bot-filter-bar .filter-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.bot===botParam || (!BOT_NAMES[botParam] && b.dataset.bot==='all'));
    });
  }
  loadDocs();
})();
</script>
</body>
</html>
