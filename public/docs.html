<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卷宗 · 老巢</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail" data-active="docs"></aside>

  <div>
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">老巢</h1>
        <span class="topbar-sub">话事厅 · Darknet Operations</span>
      </div>
      <div class="topbar-right"><span class="clock" id="clock">—</span><a href="/auth/logout" style="font-size:0.72rem;color:var(--text-3);text-decoration:none;margin-left:0.5rem;opacity:0.7" title="登出">登出</a></div>
    </header>

    <main class="page">
      <div class="page-header">
        <div>
          <h2 class="page-title">卷宗</h2>
          <p class="page-desc">核心手册置顶，团队文件、成员档案与聊天记录分层归档</p>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="manuals" onclick="switchTab('manuals',this)">核心手册</button>
        <button class="tab"        data-tab="team"   onclick="switchTab('team',this)">团队文件</button>
        <button class="tab"        data-tab="docs"   onclick="switchTab('docs',this)">档案</button>
        <button class="tab"        data-tab="memory" onclick="switchTab('memory',this)">聊天记录</button>
      </div>
      <div id="tab-explainer" style="margin:-0.65rem 0 1rem;color:var(--text-3);font-size:0.78rem;line-height:1.6">
        置顶手册与高频 SOP，不被普通系统文档或项目文档淹没。
      </div>

      <!-- bot 过滤，对档案和团队文件生效 -->
      <div class="filters" id="bot-filter-bar" style="display:none">
        <button class="filter-btn active" data-bot="all"       onclick="applyBotFilter('all',this)">全部兄弟</button>
        <button class="filter-btn"        data-bot="main"      onclick="applyBotFilter('main',this)">🏴 老大</button>
        <button class="filter-btn"        data-bot="content"   onclick="applyBotFilter('content',this)">🧠 洗脑专家</button>
        <button class="filter-btn"        data-bot="tech"      onclick="applyBotFilter('tech',this)">⌨️ 键盘杀手</button>
        <button class="filter-btn"        data-bot="intel"     onclick="applyBotFilter('intel',this)">🕵 线人</button>
        <button class="filter-btn"        data-bot="assistant" onclick="applyBotFilter('assistant',this)">🤖 跟班</button>
      </div>

      <div class="doc-layout">
        <aside class="doc-list" id="doc-list-wrap">
          <div id="doc-list" class="doc-list-inner">
            <div class="loading">载入中…</div>
          </div>
          <div id="pagination-bar" class="pagination"></div>
        </aside>
        <section class="doc-viewer" id="doc-viewer">
          <div class="doc-viewer-empty">← 点左边嘅卷宗睇内容</div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="rail.js"></script>
<script>
function updateClock(){const n=new Date();const e=document.getElementById('clock');if(e)e.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
setInterval(updateClock,1000);updateClock();

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtTime(iso){if(!iso)return'—';try{const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}catch(e){return iso;}}
function fmtSize(bytes){if(!bytes)return'—';if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/1024/1024).toFixed(2)+' MB';}

const BOT_NAMES={main:'老大',content:'洗脑专家',tech:'键盘杀手',intel:'线人',assistant:'跟班'};
const BOT_EMOJI={main:'🏴',content:'🧠',tech:'⌨️',intel:'🕵',assistant:'🤖'};

let currentTab='manuals';
let currentBot='all';
let currentDocId=null;
let currentPage=1;
const PAGE_SIZE=20;

// ── Minimal markdown renderer（够用即可，不引外部库）──────
function renderMarkdown(src){
  if(!src) return '';
  let html = esc(src);
  // fenced code block
  html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (m,lang,code)=>`<pre><code>${code}</code></pre>`);
  // headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>')
             .replace(/^## (.+)$/gm, '<h2>$1</h2>')
             .replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // bold / italic
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
             .replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  // inline code
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // blockquote
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // horizontal rule
  html = html.replace(/^---$/gm, '<hr>');
  // unordered / ordered list (simple)
  html = html.replace(/(^|\n)((?:- .+(?:\n|$))+)/g, (m,pre,block)=>{
    const items=block.trim().split('\n').map(l=>`<li>${l.replace(/^- /,'')}</li>`).join('');
    return `${pre}<ul>${items}</ul>`;
  });
  html = html.replace(/(^|\n)((?:\d+\. .+(?:\n|$))+)/g, (m,pre,block)=>{
    const items=block.trim().split('\n').map(l=>`<li>${l.replace(/^\d+\. /,'')}</li>`).join('');
    return `${pre}<ol>${items}</ol>`;
  });
  // table (very simple: | a | b |\n|---|---| ...)
  html = html.replace(/(^|\n)\|(.+?)\|\n\|([-: |]+)\|\n((?:\|.+?\|\n?)+)/g, (m,pre,head,align,body)=>{
    const heads=head.split('|').map(s=>`<th>${s.trim()}</th>`).join('');
    const rows=body.trim().split('\n').map(row=>{
      const cells=row.replace(/^\||\|$/g,'').split('|').map(s=>`<td>${s.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `${pre}<table style="width:100%;border-collapse:collapse;margin:0.8rem 0;font-size:0.85rem"><thead style="background:var(--bg-3)"><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  // paragraphs (剩余纯文本行)
  html = html.split(/\n\n+/).map(p=>{
    if(/^<(h\d|ul|ol|pre|blockquote|table|hr)/i.test(p.trim()))return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('\n');
  return html;
}

async function loadDocs(){
  const list=document.getElementById('doc-list');
  list.innerHTML='<div class="loading">载入中…</div>';

  const filterBar=document.getElementById('bot-filter-bar');
  filterBar.style.display = (currentTab==='manuals' || currentTab==='docs' || currentTab==='team') ? '' : 'none';

  try{
    const qs=`type=${currentTab}&page=${currentPage}&size=${PAGE_SIZE}` + ((currentTab==='manuals' || currentTab==='docs' || currentTab==='team') && currentBot!=='all' ? `&bot=${currentBot}` : '');
    const data=await fetch(`/api/docs?${qs}`).then(r=>r.json());
    const docs=data.docs||[];
    const total=data.total||0;
    const totalPages=data.totalPages||1;
    if(!docs.length){
      list.innerHTML='<div class="empty"><span class="empty-icon">📄</span>暂无卷宗</div>';
      renderPagination(0, 1, 1);
      return;
    }
    list.innerHTML=docs.map(d=>`
      <div class="doc-item ${d.id===currentDocId?'active':''}" onclick="openDoc('${esc(d.id)}',this)">
        <div class="doc-item-title">${d.pinned?'📌 ':''}${esc(d.title)}</div>
        <div class="doc-item-meta">
          <span>${fmtTime(d.createdAt)}</span>
          <span>${fmtSize(d.size)}</span>
        </div>
        ${(d.category||d.botId||(d.tags&&d.tags.length))?`<div class="doc-item-bot">${d.category?esc(d.category)+' · ':''}${d.tags&&d.tags.length?esc(d.tags.join(' · '))+' · ':''}${d.botId?(BOT_EMOJI[d.botId]||'●')+' '+esc(BOT_NAMES[d.botId]||d.botId):''}</div>`:''}
      </div>`).join('');

    renderPagination(total, currentPage, totalPages);

    // 自动打开第一条（仅第一页且无已选文档时）
    if(!currentDocId && docs[0]){
      openDoc(docs[0].id, list.querySelector('.doc-item'));
    }
  }catch(e){
    list.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>${esc(e.message)}</div>`;
    renderPagination(0, 1, 1);
  }
}

function renderPagination(total, page, totalPages){
  const bar=document.getElementById('pagination-bar');
  if(!bar) return;
  if(totalPages<=1&&total>0){
    bar.innerHTML='';
    return;
  }
  bar.innerHTML=`
    <button class="btn ghost sm" onclick="changePage(${page-1})" ${page<=1?'disabled':''}>← 上页</button>
    <span class="pagination-info">${page} / ${totalPages}${total?' · '+total+'条':''}</span>
    <button class="btn ghost sm" onclick="changePage(${page+1})" ${page>=totalPages?'disabled':''}>下页 →</button>
  `;
}

function changePage(p){
  if(p<1) return;
  currentPage=p;
  currentDocId=null;
  document.getElementById('doc-viewer').innerHTML='<div class="doc-viewer-empty">← 点左边嘅卷宗睇内容</div>';
  loadDocs();
}

async function openDoc(id, el){
  currentDocId=id;
  document.querySelectorAll('.doc-item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');

  const viewer=document.getElementById('doc-viewer');
  viewer.innerHTML='<div class="loading">翻开中…</div>';
  try{
    const data=await fetch(`/api/docs/${encodeURIComponent(id)}`).then(r=>r.json());
    if(!data.ok){
      viewer.innerHTML=`<div class="doc-viewer-empty">${esc(data.error||'卷宗打不开')}</div>`;
      return;
    }
    // 找到当前文档元信息
    const item=document.querySelector(`.doc-item.active .doc-item-title`);
    const title=item?item.textContent:id;
    const metaEl=document.querySelector(`.doc-item.active .doc-item-meta`);
    const metaTxt=metaEl?metaEl.textContent.trim():'';
    const botEl=document.querySelector(`.doc-item.active .doc-item-bot`);
    const botTxt=botEl?botEl.textContent.trim():'';

    // 大文件保护：避免 markdown 正则在大文本上回溯爆炸导致页面假死
    const body = data.body || '';
    const LIMIT_HARD = 500 * 1024;  // 超过就截断
    const LIMIT_SOFT = 150 * 1024;  // 超过就禁用 markdown 渲染
    let warn = '';
    let bodyHtml = '';

    if (body.length > LIMIT_HARD) {
      const truncated = body.slice(0, 300 * 1024);
      warn = `<div style="margin-bottom:1rem;padding:0.7rem 0.9rem;background:rgba(242,185,75,0.1);border-left:2px solid var(--warn);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:0.8rem;color:var(--warn)">
        ⚠ 文件过大（${(body.length/1024).toFixed(0)} KB），已截断到前 300 KB 显示；Markdown 渲染已关闭以防卡顿。完整原文需到服务器文件系统查看。
      </div>`;
      bodyHtml = `<pre style="white-space:pre-wrap;font-family:var(--font-mono);font-size:0.82rem;line-height:1.6;color:var(--text);">${esc(truncated)}</pre>`;
    } else if (body.length > LIMIT_SOFT) {
      warn = `<div style="margin-bottom:1rem;padding:0.7rem 0.9rem;background:rgba(242,185,75,0.08);border-left:2px solid var(--warn);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:0.78rem;color:var(--warn)">
        ⚠ 文件较大（${(body.length/1024).toFixed(0)} KB），为避免卡顿已切换到纯文本模式。建议把这类累积型文档按主题或日期切分（单文件建议 &lt; 50 KB）。
      </div>`;
      bodyHtml = `<pre style="white-space:pre-wrap;font-family:var(--font-mono);font-size:0.82rem;line-height:1.6;color:var(--text);">${esc(body)}</pre>`;
    } else {
      bodyHtml = renderMarkdown(body);
    }

    viewer.innerHTML=`
      <div class="doc-viewer-header">
        <div>
          <div class="doc-viewer-title">${esc(title)}</div>
          <div class="doc-viewer-meta">
            ${botTxt?`<span>${esc(botTxt)}</span>`:''}
            <span>${esc(metaTxt)}</span>
          </div>
        </div>
      </div>
      ${warn}
      <div class="doc-viewer-body">${bodyHtml}</div>`;
  }catch(e){
    viewer.innerHTML=`<div class="doc-viewer-empty">加载失败：${esc(e.message)}</div>`;
  }
}

function switchTab(tab,btn){
  currentTab=tab;
  currentDocId=null;
  currentPage=1;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const notes={
    manuals:'置顶手册与高频 SOP，不被普通系统文档或项目文档淹没。',
    team:'跨团队共用的系统关键文件、项目总账与暂停项目；不展示 memory。',
    docs:'按每位成员整理的身份、工具、待办、专属文档与定时产出。',
    memory:'聊天过程记录单独存放，不与团队文件或成员档案混合。'
  };
  document.getElementById('tab-explainer').textContent=notes[tab]||'';
  document.getElementById('doc-viewer').innerHTML='<div class="doc-viewer-empty">← 点左边嘅卷宗睇内容</div>';
  loadDocs();
}

function applyBotFilter(bot,btn){
  currentBot=bot;
  currentDocId=null;
  currentPage=1;
  document.querySelectorAll('#bot-filter-bar .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadDocs();
}

// URL 参数支持：/docs.html?bot=content → 默认切到整理文档并过滤该 bot
(function bootstrap(){
  const params=new URLSearchParams(location.search);
  const botParam=params.get('bot');
  if(botParam){
    currentTab='docs';
    currentBot=botParam;
    document.querySelectorAll('.tab').forEach(t=>{
      t.classList.toggle('active', t.dataset.tab==='docs');
    });
    document.querySelectorAll('#bot-filter-bar .filter-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.bot===botParam || (!BOT_NAMES[botParam] && b.dataset.bot==='all'));
    });
  }
  loadDocs();
})();
</script>
</body>
</html>
