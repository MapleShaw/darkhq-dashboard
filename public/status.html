<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老巢 · 哨位</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.svc-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: 0.35rem; }
.svc-card.ok   { border-left: 3px solid #22c55e; }
.svc-card.warn { border-left: 3px solid #f59e0b; }
.svc-card.err  { border-left: 3px solid #ef4444; }
.svc-name  { font-size: 0.8rem; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
.svc-label { font-size: 0.95rem; font-weight: 600; color: var(--text-1); }
.svc-status{ font-size: 0.75rem; display: flex; align-items: center; gap: 0.3rem; margin-top: 0.2rem; }
.dot-ok   { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; }
.dot-warn { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; display: inline-block; }
.dot-err  { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; display: inline-block; }
.progress-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 0.3rem; }
.progress-bar .fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.fill-ok   { background: #22c55e; }
.fill-warn { background: #f59e0b; }
.fill-err  { background: #ef4444; }
.meta-row  { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-3); margin-top: 0.15rem; }
.cron-fail-list { font-size: 0.8rem; color: var(--text-2); padding: 0; margin: 0.5rem 0 0; list-style: none; }
.cron-fail-list li { padding: 0.25rem 0; border-bottom: 1px solid var(--border); }
.cron-fail-list li:last-child { border-bottom: none; }
.badge { font-size: 0.7rem; padding: 1px 6px; border-radius: 10px; font-weight: 600; }
.badge-ok  { background: rgba(34,197,94,0.15); color: #22c55e; }
.badge-err { background: rgba(239,68,68,0.15);  color: #ef4444; }
.last-check { font-size: 0.72rem; color: var(--text-3); margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" data-active="status"></aside>

  <div>
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">老巢</h1>
        <span class="topbar-sub">哨位 · System Health</span>
      </div>
      <div class="topbar-right">
        <div class="status-chip" id="gateway-status"><span class="dot"></span><span>接线中…</span></div>
        <span class="clock" id="clock">—</span>
        <a href="/auth/logout" style="font-size:0.72rem;color:var(--text-3);text-decoration:none;margin-left:0.5rem;opacity:0.7">登出</a>
      </div>
    </header>

    <main class="page">
      <div class="page-header">
        <div>
          <h2 class="page-title">哨位</h2>
          <p class="page-desc">服务健康状态、资源占用与告警记录</p>
        </div>
        <button class="btn ghost sm" onclick="loadStatus()">↻ 更新</button>
      </div>

      <!-- 统计卡 -->
      <section class="stat-grid" id="stat-grid">
        <div class="stat"><div class="stat-label">服务</div><div class="stat-value" id="s-total">—</div><div class="stat-sub" id="s-total-sub">探查中</div></div>
        <div class="stat"><div class="stat-label">磁盘占用</div><div class="stat-value" id="s-disk">—</div><div class="stat-sub" id="s-disk-sub">—</div></div>
        <div class="stat"><div class="stat-label">内存占用</div><div class="stat-value" id="s-mem">—</div><div class="stat-sub" id="s-mem-sub">—</div></div>
        <div class="stat"><div class="stat-label">定时任务</div><div class="stat-value" id="s-cron">—</div><div class="stat-sub" id="s-cron-sub">—</div></div>
      </section>

      <div class="main-grid">
        <div class="main-col">

          <!-- 服务状态 -->
          <section class="card">
            <div class="card-header"><span class="card-title">服务状态</span></div>
            <div id="services-grid" class="status-grid" style="margin-top:0.75rem">
              <div style="color:var(--text-3);font-size:0.85rem">加载中…</div>
            </div>
          </section>

          <!-- 资源占用 -->
          <section class="card" style="margin-top:1rem">
            <div class="card-header"><span class="card-title">资源占用</span></div>
            <div style="margin-top:0.75rem;display:flex;flex-direction:column;gap:1rem">

              <div>
                <div class="meta-row"><span>磁盘 /</span><span id="disk-detail">—</span></div>
                <div class="progress-bar"><div class="fill" id="disk-bar" style="width:0%"></div></div>
              </div>

              <div>
                <div class="meta-row"><span>内存</span><span id="mem-detail">—</span></div>
                <div class="progress-bar"><div class="fill" id="mem-bar" style="width:0%"></div></div>
              </div>

            </div>
          </section>

        </div>

        <div class="side-col">

          <!-- Cron 异常 -->
          <section class="card">
            <div class="card-header">
              <span class="card-title">定时任务</span>
              <span class="badge" id="cron-badge">—</span>
            </div>
            <ul class="cron-fail-list" id="cron-fail-list">
              <li style="color:var(--text-3)">加载中…</li>
            </ul>
            <p class="last-check" id="last-check">最近监控检查：—</p>
          </section>

        </div>
      </div>
    </main>
  </div>
</div>

<script src="app.js"></script>
<script src="rail.js"></script>
<script>
async function loadStatus() {
  let data;
  try {
    const r = await fetch('/api/status');
    data = await r.json();
  } catch (e) {
    document.getElementById('services-grid').innerHTML = '<div style="color:#ef4444">加载失败，请刷新</div>';
    return;
  }
  if (!data.ok) return;

  // 统计卡
  const svcOk = (data.services || []).filter(s => s.status === 'active').length;
  const svcTotal = (data.services || []).length;
  document.getElementById('s-total').textContent = svcOk + '/' + svcTotal;
  document.getElementById('s-total-sub').textContent = svcOk === svcTotal ? '全部正常' : '有服务异常';
  document.getElementById('s-disk').textContent = (data.disk.pct || 0) + '%';
  document.getElementById('s-disk-sub').textContent = '已用 ' + data.disk.used + '，剩 ' + data.disk.avail;
  document.getElementById('s-mem').textContent = (data.mem.pct || 0) + '%';
  document.getElementById('s-mem-sub').textContent = '已用 ' + data.mem.used + 'M / ' + data.mem.total + 'M';
  const cronOk = data.cron.ok || 0;
  const cronErr = data.cron.error || 0;
  document.getElementById('s-cron').textContent = cronOk + '/' + data.cron.total;
  document.getElementById('s-cron-sub').textContent = cronErr > 0 ? cronErr + ' 个异常' : '全部正常';

  // 服务卡片
  const grid = document.getElementById('services-grid');
  grid.innerHTML = (data.services || []).map(s => {
    const ok = s.status === 'active';
    const cls = ok ? 'ok' : 'err';
    const dotCls = ok ? 'dot-ok' : 'dot-err';
    const statusText = ok ? '运行中' : s.status;
    return `<div class="svc-card ${cls}">
      <div class="svc-name">${s.name}${s.port ? ' :' + s.port : ''}</div>
      <div class="svc-label">${s.label}</div>
      <div class="svc-status"><span class="${dotCls}"></span>${statusText}</div>
    </div>`;
  }).join('');

  // 进度条
  function barClass(pct) { return pct >= 85 ? 'fill-err' : pct >= 70 ? 'fill-warn' : 'fill-ok'; }
  const diskPct = data.disk.pct || 0;
  document.getElementById('disk-detail').textContent = diskPct + '%  (' + data.disk.used + ' used, ' + data.disk.avail + ' free)';
  const db = document.getElementById('disk-bar');
  db.style.width = diskPct + '%';
  db.className = 'fill ' + barClass(diskPct);

  const memPct = data.mem.pct || 0;
  document.getElementById('mem-detail').textContent = memPct + '%  (' + data.mem.used + 'M / ' + data.mem.total + 'M)';
  const mb = document.getElementById('mem-bar');
  mb.style.width = memPct + '%';
  mb.className = 'fill ' + barClass(memPct);

  // Cron 异常
  const badge = document.getElementById('cron-badge');
  const failed = data.cron.failed || [];
  if (failed.length === 0) {
    badge.textContent = '全部正常';
    badge.className = 'badge badge-ok';
    document.getElementById('cron-fail-list').innerHTML = '<li style="color:var(--text-3)">无异常任务 ✅</li>';
  } else {
    badge.textContent = failed.length + ' 个异常';
    badge.className = 'badge badge-err';
    document.getElementById('cron-fail-list').innerHTML = failed.map(f =>
      `<li><span style="color:var(--text-1)">${f.name}</span> <span style="color:#ef4444;font-size:0.72rem">连续失败 ${f.consecutiveErrors} 次</span></li>`
    ).join('');
  }

  // 最近检查时间
  if (data.monitor && data.monitor.lastCheck) {
    const d = new Date(data.monitor.lastCheck);
    document.getElementById('last-check').textContent = '最近监控检查：' + d.toLocaleString('zh-CN');
  }

  // Gateway 状态
  const gwEl = document.getElementById('gateway-status');
  if (data.gateway && data.gateway.online) {
    gwEl.className = 'status-chip online';
    gwEl.innerHTML = '<span class="dot"></span><span>在线</span>';
  } else {
    gwEl.className = 'status-chip offline';
    gwEl.innerHTML = '<span class="dot"></span><span>离线</span>';
  }
}

// 时钟
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

loadStatus();
setInterval(loadStatus, 30000);
</script>
</body>
</html>
