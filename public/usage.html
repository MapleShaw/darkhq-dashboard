<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用量详情 · DarkHQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .usage-page { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem; }
    .usage-page h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.4rem; }
    .usage-page .sub { font-size: 0.82rem; color: var(--text-3); margin-bottom: 2rem; }
    .usage-section { margin-bottom: 2rem; }
    .usage-section h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 1rem; }
    .quota-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 500px) { .quota-cards { grid-template-columns: 1fr; } }
    .quota-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
    }
    .quota-card-title { font-size: 0.72rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.8rem; }
    .quota-card-big { font-size: 2rem; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-bottom: 0.3rem; }
    .quota-card-big span { font-size: 1rem; font-weight: 400; color: var(--text-3); margin-left: 0.3rem; }
    .quota-card-bar-track { height: 6px; border-radius: 999px; background: var(--bg-3); overflow: hidden; margin: 0.7rem 0 0.5rem; }
    .quota-card-bar-fill { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
    .quota-card-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-3); font-family: var(--font-mono); }
    .model-table { width: 100%; border-collapse: collapse; }
    .model-table th { font-size: 0.7rem; color: var(--text-3); text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
    .model-table td { font-size: 0.78rem; padding: 0.55rem 0.6rem; border-bottom: 0.5px solid var(--line); color: var(--text-2); vertical-align: middle; }
    .model-table td.mono { font-family: var(--font-mono); color: var(--text-1); }
    .model-bar { height: 5px; border-radius: 999px; background: var(--accent); opacity: 0.8; }
    .plan-badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; background: var(--accent); color: var(--bg-1); font-weight: 600; }
    .plan-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-2); }
    .plan-row strong { color: var(--text-1); }
    .loading-msg { color: var(--text-3); font-size: 0.82rem; padding: 1.5rem 0; }
    .back-link { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: var(--text-3); text-decoration: none; margin-bottom: 1.5rem; }
    .back-link:hover { color: var(--text-1); }
    .period-label { font-size: 0.72rem; color: var(--text-3); font-family: var(--font-mono); }
  </style>
</head>
<body>
  <div class="page-wrap">
    <nav class="rail" id="rail"></nav>
    <main class="page usage-page">
      <a href="/" class="back-link">← 返回总部</a>
      <h1>用量详情</h1>
      <div class="sub" id="usage-sub">载入中…</div>

      <!-- 配额窗口 -->
      <div class="usage-section">
        <h2>配额窗口</h2>
        <div class="quota-cards" id="quota-cards">
          <div class="loading-msg">载入中…</div>
        </div>
      </div>

      <!-- 模型分布 -->
      <div class="usage-section">
        <h2>模型分布（计费周期）</h2>
        <table class="model-table" id="model-table">
          <thead><tr><th>模型</th><th>花费 (USD)</th><th>占比</th><th style="width:120px"></th></tr></thead>
          <tbody id="model-tbody"><tr><td colspan="4" class="loading-msg">载入中…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="rail.js"></script>
  <script>
    const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const fmtNum = (n) => Number(n).toLocaleString('zh-CN');
    const fmtFlows = (v) => v != null ? (v >= 1000 ? (v/1000).toFixed(1)+'k' : Math.round(v).toString()) : '—';
    const fmtUSD = (v) => v != null ? '$' + Number(v).toFixed(2) : '—';

    const fmtResetFull = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso);
      const sh = new Date(d.getTime() + 8 * 3600 * 1000);
      return sh.toISOString().slice(0,16).replace('T',' ') + ' (CST)';
    };

    const barColor = (pct) => pct >= 90 ? '#ff4d4d' : pct >= 70 ? '#e08a00' : 'var(--accent)';

    function renderQuotaCard(title, q) {
      const pct = Math.min(100, Math.round((q.usage_percentage || 0) * 100));
      return `
        <div class="quota-card">
          <div class="quota-card-title">${esc(title)}</div>
          <div class="quota-card-big">${fmtFlows(q.used_flows)}<span>/ ${fmtFlows(q.max_flows)} flows</span></div>
          <div class="quota-card-bar-track">
            <div class="quota-card-bar-fill" style="width:${pct}%;background:${barColor(pct)}"></div>
          </div>
          <div class="quota-card-meta">
            <span>剩余 ${fmtFlows(q.remaining_flows)} flows</span>
            <span>${pct}%</span>
          </div>
          <div style="margin-top:0.6rem;font-size:0.7rem;color:var(--text-3);font-family:var(--font-mono)">
            ${fmtUSD(q.used_value_usd)} / ${fmtUSD(q.max_value_usd)} · 重置于 ${fmtResetFull(q.resets_at)}
          </div>
        </div>`;
    }

    async function loadUsage() {
      try {
        // 并行拉两个接口
        const [subResp, usageResp] = await Promise.all([
          fetch('/api/subscription').then(r => r.json()),
          fetch('/api/usage').then(r => r.json()),
        ]);

        // ── 计划信息 ──
        const d = subResp.ok ? subResp.data : null;
        const plan = d?.plan || {};
        document.getElementById('usage-sub').innerHTML = d ? `
          <span class="plan-badge">${esc(plan.tier || 'unknown')}</span>
          &nbsp; 到期：${plan.expires_at ? esc(new Date(new Date(plan.expires_at).getTime()+8*3600000).toISOString().slice(0,10)) : '—'}
          &nbsp;·&nbsp; $${plan.amount_usd ?? '—'}/mo
        ` : '─';

        // ── 配额窗口 ──
        if (d) {
          document.getElementById('quota-cards').innerHTML =
            renderQuotaCard('5小时窗口', d.quota_5_hour || {}) +
            renderQuotaCard('7天窗口', d.quota_7_day || {});
        }

        // ── 模型分布 ──
        const u = usageResp.usage || {};
        const models = u.models || [];
        const tbody = document.getElementById('model-tbody');
        if (!models.length) {
          tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text-3);padding:1rem 0.6rem">暂无模型数据</td></tr>';
        } else {
          tbody.innerHTML = models.map((m, i) => `
            <tr>
              <td>${esc(m.model || m.id)}</td>
              <td class="mono">${m.costUSD != null ? '$'+m.costUSD.toFixed(4) : '—'}</td>
              <td class="mono">${m.pct}%</td>
              <td><div class="model-bar" style="width:${m.pct}%;background:${i===0?'var(--accent)':i===1?'#e04850':'#7b6f9e'}"></div></td>
            </tr>`).join('');
        }

        // 计费周期标签
        if (u.statPeriod) {
          const h2 = document.querySelector('#model-table').previousElementSibling;
          if (h2) h2.innerHTML = `模型分布 <span class="period-label">${esc(u.statPeriod)}</span>`;
        }

      } catch (e) {
        document.getElementById('usage-sub').textContent = '加载失败：' + e.message;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initRail === 'function') initRail();
      loadUsage();
    });
  </script>
</body>
</html>
