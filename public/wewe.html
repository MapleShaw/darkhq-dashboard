<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微读 · 老巢</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ── wewe 页面专用样式 ─────────────────────────────────── */
.wewe-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-top: 1.25rem;
}
@media (max-width: 800px) { .wewe-grid { grid-template-columns: 1fr; } }

.account-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.65rem 0;
  border-bottom: 1px solid var(--line);
}
.account-row:last-child { border-bottom: none; }
.account-name { flex: 1; font-weight: 500; font-size: 0.9rem; }
.account-id   { font-size: 0.72rem; color: var(--text-3); font-family: var(--font-mono); }
.account-time { font-size: 0.72rem; color: var(--text-3); }

/* Feed 列表 */
.feed-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--line);
}
.feed-row:last-child { border-bottom: none; }
.feed-cover {
  width: 32px; height: 32px;
  border-radius: 6px;
  object-fit: cover;
  background: var(--bg-3);
  flex-shrink: 0;
}
.feed-cover-placeholder {
  width: 32px; height: 32px;
  border-radius: 6px;
  background: var(--bg-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.feed-info { flex: 1; min-width: 0; }
.feed-name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed-meta { font-size: 0.72rem; color: var(--text-3); margin-top: 2px; }
.feed-actions { display: flex; gap: 0.4rem; }


.feed-toolbar {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.feed-add-box {
  margin-bottom: 0.9rem;
  padding: 0.85rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-2);
}
.feed-add-box textarea {
  width: 100%;
  min-height: 86px;
  resize: vertical;
  box-sizing: border-box;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg-1);
  color: var(--text-1);
  padding: 0.65rem;
  font: 0.82rem var(--font-mono);
  outline: none;
}
.feed-add-box textarea:focus { border-color: var(--accent); }
.feed-add-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-top: 0.6rem;
}
.feed-add-hint { color: var(--text-3); font-size: 0.72rem; }
.feed-status { font-size: 0.76rem; margin-top: 0.55rem; color: var(--text-2); }
.feed-status.ok { color: var(--ok); }
.feed-status.err { color: var(--err); }
.feed-danger { color: var(--err) !important; }

/* QR 弹层 */
.qr-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
}
.qr-box {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 2rem;
  text-align: center;
  min-width: 280px;
}
.qr-box h3 { margin: 0 0 0.5rem; font-size: 1rem; }
.qr-box p  { color: var(--text-2); font-size: 0.82rem; margin: 0 0 1rem; }
.qr-img    { width: 200px; height: 200px; border-radius: 8px; border: 1px solid var(--line); }
.qr-status { margin-top: 0.75rem; font-size: 0.82rem; color: var(--text-2); }
.qr-close  { margin-top: 1rem; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" data-active="wewe"></aside>

  <div>
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">老巢</h1>
        <span class="topbar-sub">话事厅 · Darknet Operations</span>
      </div>
      <div class="topbar-right"><span class="clock" id="clock">—</span><a href="/auth/logout" style="font-size:0.72rem;color:var(--text-3);text-decoration:none;margin-left:0.5rem;opacity:0.7" title="登出">登出</a></div>
    </header>

    <main class="page">
      <div class="page-header">
        <div>
          <h2 class="page-title">微读</h2>
          <p class="page-desc">微信公众号 RSS · wewe-rss 账号与订阅管理</p>
        </div>
        <button class="btn ghost sm" onclick="loadAll()">↻ 刷新</button>
      </div>

      <!-- KPI -->
      <section class="stat-grid">
        <div class="stat"><div class="stat-label">账号</div><div class="stat-value" id="stat-accounts">—</div><div class="stat-sub" id="stat-accounts-sub">加载中</div></div>
        <div class="stat"><div class="stat-label">订阅公众号</div><div class="stat-value" id="stat-feeds">—</div><div class="stat-sub">个</div></div>
        <div class="stat"><div class="stat-label">服务</div><div class="stat-value" id="stat-service">—</div><div class="stat-sub">wewe-rss :4000</div></div>
      </section>

      <div class="wewe-grid">
        <!-- 账号面板 -->
        <div class="card">
          <div class="card-title">账号状态</div>
          <div id="accounts-list"><div class="loading">连线中…</div></div>
        </div>

        <!-- Feed 面板 -->
        <div class="card">
          <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;gap:1rem">
            <span>订阅公众号</span>
            <span class="feed-toolbar">
              <button class="btn ghost sm" onclick="toggleAddFeedBox()" id="btn-toggle-add">＋ 添加</button>
              <button class="btn ghost sm" onclick="refreshAllFeeds()" id="btn-refresh-all">⟳ 全部抓取</button>
            </span>
          </div>
          <div class="feed-add-box" id="feed-add-box" style="display:none">
            <textarea id="feed-add-input" placeholder="粘贴公众号文章链接，支持一行一个：
https://mp.weixin.qq.com/s/...

也支持直接填 MP_WXS_1234567890"></textarea>
            <div class="feed-add-actions">
              <span class="feed-add-hint">优先粘公众号文章链接；高级用法也可直接填 MP_WXS_...。</span>
              <button class="btn sm" onclick="addFeeds()" id="btn-add-feed">添加订阅</button>
            </div>
            <div class="feed-status" id="feed-add-status"></div>
          </div>
          <div id="feeds-list"><div class="loading">连线中…</div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 扫码弹层 -->
<div class="qr-overlay" id="qr-overlay" style="display:none">
  <div class="qr-box">
    <h3>重新登录</h3>
    <p id="qr-account-label">账号：—</p>
    <div id="qr-display" style="width:200px;height:200px;margin:0 auto;border-radius:8px;border:1px solid var(--line);overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;"></div>
    <div class="qr-status" id="qr-status">等待扫码…</div>
    <button class="btn ghost sm qr-close" onclick="closeQr()">取消</button>
  </div>
</div>

<script src="rail.js"></script>
<script>
// ── 工具函数 ─────────────────────────────────────────────────
function updateClock(){const n=new Date();const e=document.getElementById('clock');if(e)e.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
setInterval(updateClock,1000);updateClock();

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(ts){
  if(!ts)return'—';
  try{const d=new Date(typeof ts==='number'?ts*1000:ts);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
  catch(e){return String(ts);}
}

// ── 账号 ─────────────────────────────────────────────────────
async function loadAccounts(){
  const box=document.getElementById('accounts-list');
  try{
    const d=await fetch('/api/wewe/accounts').then(r=>r.json());
    if(!d.ok) throw new Error(d.error||'请求失败');
    const accounts=d.accounts||[];
    const okCount=accounts.filter(a=>a.status===1).length;
    document.getElementById('stat-accounts').textContent=accounts.length;
    const sub=document.getElementById('stat-accounts-sub');
    if(accounts.length===0){
      sub.textContent='暂无账号';sub.className='stat-sub';
    }else if(okCount===accounts.length){
      sub.textContent='全部在线';sub.className='stat-sub ok';
    }else{
      sub.textContent=`${okCount} 在线 / ${accounts.length-okCount} 失效`;sub.className='stat-sub err';
    }
    document.getElementById('stat-service').textContent='✓';
    if(!accounts.length){
      box.innerHTML='<div class="empty"><span class="empty-icon">👤</span>暂无账号</div>';return;
    }
    box.innerHTML=accounts.map(a=>`
      <div class="account-row">
        <div>
          <div class="account-name">${esc(a.name)}</div>
          <div class="account-id">${esc(a.id)}</div>
          <div class="account-time">更新 ${fmtDate(a.updatedAt)}</div>
        </div>
        <span class="badge ${a.status===1?'ok':'err'}" style="margin-left:auto;margin-right:0.5rem">${a.status===1?'在线':'失效'}</span>
        <button class="btn ghost sm" onclick="startLogin('${esc(a.id)}','${esc(a.name)}')">重新登录</button>
      </div>`).join('');
  }catch(e){
    document.getElementById('stat-service').textContent='✗';
    box.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>${esc(e.message)}</div>`;
  }
}

// ── Feed 列表 ─────────────────────────────────────────────────
async function loadFeeds(){
  const box=document.getElementById('feeds-list');
  try{
    const d=await fetch('/api/wewe/feeds').then(r=>r.json());
    if(!d.ok) throw new Error(d.error||'请求失败');
    const feeds=d.feeds||[];
    document.getElementById('stat-feeds').textContent=feeds.length;
    if(!feeds.length){
      box.innerHTML='<div class="empty"><span class="empty-icon">📰</span>暂无订阅</div>';return;
    }
    box.innerHTML=feeds.map(f=>`
      <div class="feed-row">
        ${f.mpCover
          ?`<img class="feed-cover" src="${esc(f.mpCover)}" alt="" onerror="this.style.display='none'">`
          :`<div class="feed-cover-placeholder">📰</div>`}
        <div class="feed-info">
          <div class="feed-name">${esc(f.mpName)}</div>
          <div class="feed-meta">同步 ${fmtDate(f.syncTime)} · 更新 ${fmtDate(f.updateTime)}</div>
        </div>
        <div class="feed-actions">
          <button class="btn ghost sm" onclick="refreshFeed('${esc(f.id)}','${esc(f.mpName)}')" title="立即抓取">⟳</button>
          <button class="btn ghost sm feed-danger" onclick="deleteFeed('${esc(f.id)}','${esc(f.mpName)}')" title="删除订阅">删</button>
        </div>
      </div>`).join('');
  }catch(e){
    box.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>${esc(e.message)}</div>`;
  }
}

async function loadAll(){
  await Promise.all([loadAccounts(), loadFeeds()]);
}


// ── Feed 管理：添加 / 删除 ───────────────────────────────────
function toggleAddFeedBox(){
  const box=document.getElementById('feed-add-box');
  const btn=document.getElementById('btn-toggle-add');
  const open=box.style.display==='none';
  box.style.display=open?'block':'none';
  if(btn) btn.textContent=open?'收起':'＋ 添加';
  if(open) document.getElementById('feed-add-input')?.focus();
}

async function addFeeds(){
  const input=document.getElementById('feed-add-input');
  const status=document.getElementById('feed-add-status');
  const btn=document.getElementById('btn-add-feed');
  const text=(input.value||'').trim();
  if(!text){status.className='feed-status err';status.textContent='先粘贴公众号文章链接，或填写 MP_WXS_...';return;}
  btn.disabled=true;btn.textContent='添加中…';
  status.className='feed-status';status.textContent='正在识别公众号并添加订阅…';
  try{
    const d=await fetch('/api/wewe/feeds/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wxsLinks:text})}).then(r=>r.json());
    const added=d.added||[];
    const failed=d.failed||[];
    if(added.length){
      status.className='feed-status ok';
      status.textContent=`已添加 ${added.length} 个：${added.map(x=>x.mpName||x.name||x.id).join('、')}${failed.length?`；失败 ${failed.length} 个`:''}`;
      input.value='';
      await loadFeeds();
    }else{
      status.className='feed-status err';
      status.textContent=(failed[0]&&failed[0].error)||d.error||'添加失败';
    }
  }catch(e){
    status.className='feed-status err';status.textContent=e.message;
  }finally{
    btn.disabled=false;btn.textContent='添加订阅';
  }
}

async function deleteFeed(mpId, name){
  if(!confirm(`确定删除「${name}」？\n\n只删除订阅源，已抓取文章不会一起删除。`)) return;
  try{
    const d=await fetch('/api/wewe/feeds/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mpId})}).then(r=>r.json());
    if(!d.ok) throw new Error(d.error||'删除失败');
    await loadFeeds();
  }catch(e){
    alert('删除失败：'+e.message);
  }
}

// ── 单个 Feed 抓取 ───────────────────────────────────────────
async function refreshFeed(mpId, name){
  const btn=event.target;
  btn.disabled=true; btn.textContent='…';
  try{
    const d=await fetch('/api/wewe/feeds/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mpId})}).then(r=>r.json());
    btn.textContent=d.ok?'✓':'✗';
    setTimeout(()=>{btn.disabled=false;btn.textContent='⟳';},2000);
  }catch(e){
    btn.textContent='✗';btn.disabled=false;
  }
}

// ── 全部抓取 ─────────────────────────────────────────────────
async function refreshAllFeeds(){
  const btn=document.getElementById('btn-refresh-all');
  btn.disabled=true; btn.textContent='抓取中…';
  try{
    const d=await fetch('/api/wewe/feeds/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}' }).then(r=>r.json());
    btn.textContent=d.ok?'✓ 已触发':'✗ 失败';
    setTimeout(()=>{btn.disabled=false;btn.textContent='⟳ 全部抓取';},3000);
  }catch(e){
    btn.textContent='✗ 失败'; btn.disabled=false;
  }
}

// ── 扫码登录 ─────────────────────────────────────────────────
let _loginKey=null;
let _loginAccountId=null;
let _loginAccountName=null;
let _pollTimer=null;

async function startLogin(accountId, accountName){
  _loginAccountId=accountId;
  _loginAccountName=accountName;
  _loginKey=null;
  document.getElementById('qr-account-label').textContent='账号：'+accountName+' ('+accountId+')';
  const disp=document.getElementById('qr-display');
  if(disp) disp.innerHTML='<span style="color:#999;font-size:0.8rem">加载中…</span>';
  document.getElementById('qr-status').textContent='正在生成二维码…';
  document.getElementById('qr-overlay').style.display='flex';
  try{
    const d=await fetch('/api/wewe/login/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.json());
    if(!d.ok||!d.key) throw new Error(d.error||'获取登录信息失败');
    _loginKey=d.key;
    if(disp){
      if(d.qrSvg){
        disp.innerHTML=d.qrSvg;
        const svg=disp.querySelector('svg');
        if(svg){svg.style.width='100%';svg.style.height='100%';}
      }else if(d.qrCodeUrl){
        disp.innerHTML='<img src="'+d.qrCodeUrl+'" style="width:100%;height:100%;object-fit:cover" alt="微信扫码">';
      }else{
        disp.innerHTML='<span style="color:#999;font-size:0.8rem">二维码加载失败</span>';
      }
    }
    document.getElementById('qr-status').textContent='请用微信扫码登录…';
    startPoll();
  }catch(e){
    document.getElementById('qr-status').textContent='⚠ '+e.message;
  }
}

function startPoll(){
  if(_pollTimer) clearInterval(_pollTimer);
  let attempts=0;
  _pollTimer=setInterval(async()=>{
    if(!_loginKey){clearInterval(_pollTimer);return;}
    attempts++;
    if(attempts>60){
      clearInterval(_pollTimer);
      document.getElementById('qr-status').textContent='⏱ 超时，请重试';
      return;
    }
    try{
      const d=await fetch(`/api/wewe/login/poll?key=${encodeURIComponent(_loginKey)}`).then(r=>r.json());
      if(d.token){
        clearInterval(_pollTimer);
        document.getElementById('qr-status').textContent='✅ 扫码成功，写入 token…';
        await submitToken(d.token);
      }
    }catch(e){/* 继续轮询 */}
  },2000);
}

async function submitToken(token){
  try{
    const d=await fetch('/api/wewe/login/add',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:_loginAccountId,token,name:_loginAccountName,status:1})
    }).then(r=>r.json());
    if(d.ok){
      document.getElementById('qr-status').textContent='🎉 登录成功！账号已恢复在线';
      setTimeout(()=>{ closeQr(); loadAccounts(); },1500);
    }else{
      document.getElementById('qr-status').textContent='⚠ 写入失败：'+(d.error||'未知错误');
    }
  }catch(e){
    document.getElementById('qr-status').textContent='⚠ '+e.message;
  }
}

function closeQr(){
  if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}
  document.getElementById('qr-overlay').style.display='none';
  _loginKey=null;
}

document.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>
