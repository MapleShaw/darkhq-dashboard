<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 · 老巢</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .quota-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.2rem; }
  @media (max-width: 500px) { .quota-cards { grid-template-columns: 1fr; } }
  .quota-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
  }
  .quota-card-title { font-size: 0.72rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.8rem; }
  .quota-card-big { font-size: 2rem; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-bottom: 0.3rem; }
  .quota-card-big span { font-size: 1rem; font-weight: 400; color: var(--text-3); margin-left: 0.3rem; }
  .quota-card-bar-track { height: 6px; border-radius: 999px; background: var(--bg-3); overflow: hidden; margin: 0.7rem 0 0.5rem; }
  .quota-card-bar-fill { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
  .quota-card-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-3); font-family: var(--font-mono); }
  .model-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  .model-table th { font-size: 0.7rem; color: var(--text-3); text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
  .model-table td { font-size: 0.78rem; padding: 0.55rem 0.6rem; border-bottom: 0.5px solid var(--line); color: var(--text-2); vertical-align: middle; }
  .model-table td.mono { font-family: var(--font-mono); color: var(--text-1); }
  .model-bar { height: 5px; border-radius: 999px; background: var(--accent); opacity: 0.8; }
  .plan-badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; background: var(--accent); color: var(--bg-1); font-weight: 600; }
  .plan-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-2); margin-bottom: 1rem; }
  .period-label { font-size: 0.72rem; color: var(--text-3); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" data-active="settings"></aside>

  <div>
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">老巢</h1>
        <span class="topbar-sub">话事厅 · Darknet Operations</span>
      </div>
      <div class="topbar-right"><span class="clock" id="clock">—</span></div>
    </header>

    <main class="page">
      <div class="page-header">
        <div>
          <h2 class="page-title">设置</h2>
          <p class="page-desc">班底身份与 Token 用量配置</p>
        </div>
      </div>

      <div class="main-grid">
        <div class="main-col">

          <section class="card">
            <div class="card-title">
              班底身份
              <button class="btn primary sm" onclick="saveAllBots()">保存</button>
            </div>
            <div id="bot-settings-list" style="display:flex;flex-direction:column;gap:0.5rem">
              <div class="loading">载入中…</div>
            </div>
            <div id="bot-save-msg" style="margin-top:0.8rem;font-size:0.8rem;text-align:right;min-height:1.2rem"></div>
          </section>

          <section class="card">
            <div class="card-title">
              Token 用量
              <button class="btn ghost sm" onclick="loadUsage()">↻ 更新</button>
            </div>
            <div id="usage-panel"><div class="loading">载入中…</div></div>
          </section>

        </div>

        <div class="side-col">
          <section class="card">
            <div class="card-title">系统</div>
            <div class="info-list">
              <div class="info-item"><span class="label">版本</span><span class="value">v3.2</span></div>
              <div class="info-item"><span class="label">域名</span><span class="value"><a href="https://darkhq.indiehacker.fun" target="_blank">darkhq.indiehacker.fun</a></span></div>
              <div class="info-item"><span class="label">证书到期</span><span class="value">2026-07-31</span></div>
              <div class="info-item"><span class="label">线路</span><span class="value" id="gw-status-txt">—</span></div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="rail.js"></script>
<script>
function updateClock(){const n=new Date();const e=document.getElementById('clock');if(e)e.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
setInterval(updateClock,1000);updateClock();

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let botsData=[];

async function loadBots(){
  const el=document.getElementById('bot-settings-list');
  el.innerHTML='<div class="loading">载入中…</div>';
  try{
    const data=await fetch('/api/bots').then(r=>r.json());
    botsData=data.bots||[];

    let saved={};
    try{
      const sr=await fetch('/bot-settings.json');
      if(sr.ok){const sj=await sr.json();(sj.bots||[]).forEach(b=>{saved[b.id]=b;});}
    }catch(e){}

    if(!botsData.length){
      el.innerHTML='<div class="empty"><span class="empty-icon">🤖</span>暂无 Bot</div>';
      return;
    }

    el.innerHTML=botsData.map(bot=>{
      const s=saved[bot.id]||{};
      const name=s.name||bot.name;
      const role=s.role||bot.role;
      const avatar=bot.avatarUrl||`/avatars/bot-${bot.id}.png`;
      return `
      <div style="display:flex;gap:0.7rem;align-items:center;padding:0.55rem 0.8rem;background:var(--bg-2);border-radius:var(--r-md)">
        <div style="width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--bg-3);flex-shrink:0;border:1px solid var(--line)">
          <img src="${esc(avatar)}" alt="${esc(bot.name)}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">
        </div>
        <input type="text" class="input bot-name-input" data-id="${esc(bot.id)}" value="${esc(name)}" placeholder="名称" style="width:5.5rem;flex-shrink:0">
        <input type="text" class="input bot-role-input" data-id="${esc(bot.id)}" value="${esc(role)}" placeholder="角色" style="flex:1;min-width:0">
        <span style="font-size:0.68rem;color:var(--text-3);font-family:var(--font-mono);white-space:nowrap;flex-shrink:0">${esc(bot.model)}</span>
      </div>`;
    }).join('');

    const gw=document.getElementById('gw-status-txt');
    if(gw){
      if(data.gatewayOnline) gw.innerHTML='<span style="color:var(--ok)">● 接通</span>';
      else gw.innerHTML='<span style="color:var(--err)">● 断线</span>';
    }
  }catch(e){
    el.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>${esc(e.message)}</div>`;
  }
}

async function saveAllBots(){
  const msg=document.getElementById('bot-save-msg');
  const bots=botsData.map(b=>{
    const n=document.querySelector(`.bot-name-input[data-id="${b.id}"]`);
    const r=document.querySelector(`.bot-role-input[data-id="${b.id}"]`);
    return{id:b.id,name:n?n.value.trim():b.name,role:r?r.value.trim():b.role};
  });
  try{
    const res=await fetch('/api/settings/bots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bots})});
    const data=await res.json();
    if(data.ok)msg.innerHTML='<span style="color:var(--ok)">✓ 保存成功</span>';
    else msg.innerHTML=`<span style="color:var(--err)">✗ ${esc(data.error||'保存失败')}</span>`;
  }catch(e){
    msg.innerHTML=`<span style="color:var(--err)">✗ ${esc(e.message)}</span>`;
  }
  setTimeout(()=>{msg.innerHTML='';},3000);
}

/* ── Usage helpers ── */
const fmtNum = (n) => Number(n).toLocaleString('zh-CN');
const fmtFlows = (v) => v != null ? (v >= 1000 ? (v/1000).toFixed(1)+'k' : Math.round(v).toString()) : '—';
const fmtUSD = (v) => v != null ? '$' + Number(v).toFixed(2) : '—';

const fmtResetFull = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  const sh = new Date(d.getTime() + 8 * 3600 * 1000);
  return sh.toISOString().slice(0,16).replace('T',' ') + ' (CST)';
};

const barColor = (pct) => pct >= 90 ? '#ff4d4d' : pct >= 70 ? '#e08a00' : 'var(--accent)';

function renderQuotaCard(title, q) {
  const pct = Math.min(100, Math.round((q.usage_percentage || 0) * 100));
  return `
    <div class="quota-card">
      <div class="quota-card-title">${esc(title)}</div>
      <div class="quota-card-big">${fmtFlows(q.used_flows)}<span>/ ${fmtFlows(q.max_flows)} flows</span></div>
      <div class="quota-card-bar-track">
        <div class="quota-card-bar-fill" style="width:${pct}%;background:${barColor(pct)}"></div>
      </div>
      <div class="quota-card-meta">
        <span>剩余 ${fmtFlows(q.remaining_flows)} flows</span>
        <span>${pct}%</span>
      </div>
      <div style="margin-top:0.6rem;font-size:0.7rem;color:var(--text-3);font-family:var(--font-mono)">
        ${fmtUSD(q.used_value_usd)} / ${fmtUSD(q.max_value_usd)} · 重置于 ${fmtResetFull(q.resets_at)}
      </div>
    </div>`;
}

async function loadUsage(){
  const el=document.getElementById('usage-panel');
  el.innerHTML='<div class="loading">载入中…</div>';
  try{
    const [subResp, usageResp] = await Promise.all([
      fetch('/api/subscription').then(r=>r.json()),
      fetch('/api/usage').then(r=>r.json()),
    ]);

    // handle legacy notConnected state
    if(usageResp.notConnected){
      el.innerHTML=`
        <div style="padding:1rem 1.2rem;background:rgba(242,185,75,0.08);border-left:3px solid var(--warn);border-radius:0 var(--r-sm) var(--r-sm) 0">
          <div style="color:var(--warn);font-weight:600;margin-bottom:0.4rem">⚠ Gateway 未对接 Token 用量接口</div>
          <div style="font-size:0.85rem;color:var(--text-2);line-height:1.6">${esc(usageResp.reason||'Gateway 未暴露 /api/usage')}</div>
        </div>`;
      return;
    }

    let html='';

    // ── 计划信息 badge ──
    const d = subResp.ok ? subResp.data : null;
    const plan = d?.plan || {};
    if(d){
      html += `<div class="plan-row">
        <span class="plan-badge">${esc(plan.tier || 'unknown')}</span>
        <span>到期：${plan.expires_at ? esc(new Date(new Date(plan.expires_at).getTime()+8*3600000).toISOString().slice(0,10)) : '—'}</span>
        <span>$${plan.amount_usd ?? '—'}/mo</span>
      </div>`;
    }

    // ── 配额窗口 ──
    if(d){
      html += `<div class="quota-cards">
        ${renderQuotaCard('5小时窗口', d.quota_5_hour || {})}
        ${renderQuotaCard('7天窗口', d.quota_7_day || {})}
      </div>`;
    }

    // ── 模型分布 ──
    const u = usageResp.usage || {};
    const models = u.models || [];
    const periodLabel = u.statPeriod ? ` <span class="period-label">${esc(u.statPeriod)}</span>` : '';
    html += `<div style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:0.4rem;font-weight:500">模型分布${periodLabel}</div>`;

    if(!models.length){
      html += '<div style="color:var(--text-3);font-size:0.82rem;padding:0.8rem 0">暂无模型数据</div>';
    } else {
      html += `<table class="model-table">
        <thead><tr><th>模型</th><th>花费 (USD)</th><th>占比</th><th style="width:120px"></th></tr></thead>
        <tbody>${models.map((m, i) => `
          <tr>
            <td>${esc(m.model || m.id)}</td>
            <td class="mono">${m.costUSD != null ? '$'+m.costUSD.toFixed(4) : '—'}</td>
            <td class="mono">${m.pct}%</td>
            <td><div class="model-bar" style="width:${m.pct}%;background:${i===0?'var(--accent)':i===1?'#e04850':'#7b6f9e'}"></div></td>
          </tr>`).join('')}</tbody>
      </table>`;
    }

    el.innerHTML=html;

  }catch(e){
    el.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>加载失败：${esc(e.message)}</div>`;
  }
}

document.addEventListener('DOMContentLoaded',()=>{loadBots();loadUsage();});
</script>
</body>
</html>
