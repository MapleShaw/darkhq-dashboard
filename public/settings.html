<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 · 老巢</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail" data-active="settings"></aside>

  <div>
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">老巢</h1>
        <span class="topbar-sub">话事厅 · Darknet Operations</span>
      </div>
      <div class="topbar-right"><span class="clock" id="clock">—</span></div>
    </header>

    <main class="page">
      <div class="page-header">
        <div>
          <h2 class="page-title">设置</h2>
          <p class="page-desc">班底身份与 Token 用量配置</p>
        </div>
      </div>

      <div class="main-grid">
        <div class="main-col">

          <section class="card">
            <div class="card-title">
              班底身份
              <button class="btn primary sm" onclick="saveAllBots()">保存</button>
            </div>
            <div id="bot-settings-list" style="display:flex;flex-direction:column;gap:1rem">
              <div class="loading">载入中…</div>
            </div>
            <div id="bot-save-msg" style="margin-top:0.8rem;font-size:0.8rem;text-align:right;min-height:1.2rem"></div>
          </section>

          <section class="card">
            <div class="card-title">
              Token 用量
              <button class="btn ghost sm" onclick="loadUsage()">↻ 更新</button>
            </div>
            <div id="usage-panel"><div class="loading">载入中…</div></div>
          </section>

        </div>

        <div class="side-col">
          <section class="card">
            <div class="card-title">系统</div>
            <div class="info-list">
              <div class="info-item"><span class="label">版本</span><span class="value">v3.2</span></div>
              <div class="info-item"><span class="label">域名</span><span class="value"><a href="https://darkhq.indiehacker.fun" target="_blank">darkhq.indiehacker.fun</a></span></div>
              <div class="info-item"><span class="label">证书到期</span><span class="value">2026-07-31</span></div>
              <div class="info-item"><span class="label">线路</span><span class="value" id="gw-status-txt">—</span></div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="rail.js"></script>
<script>
function updateClock(){const n=new Date();const e=document.getElementById('clock');if(e)e.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
setInterval(updateClock,1000);updateClock();

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let botsData=[];

async function loadBots(){
  const el=document.getElementById('bot-settings-list');
  el.innerHTML='<div class="loading">载入中…</div>';
  try{
    const data=await fetch('/api/bots').then(r=>r.json());
    botsData=data.bots||[];

    let saved={};
    try{
      const sr=await fetch('/bot-settings.json');
      if(sr.ok){const sj=await sr.json();(sj.bots||[]).forEach(b=>{saved[b.id]=b;});}
    }catch(e){}

    if(!botsData.length){
      el.innerHTML='<div class="empty"><span class="empty-icon">🤖</span>暂无 Bot</div>';
      return;
    }

    el.innerHTML=botsData.map(bot=>{
      const s=saved[bot.id]||{};
      const name=s.name||bot.name;
      const role=s.role||bot.role;
      const avatar=bot.avatarUrl||`/avatars/bot-${bot.id}.png`;
      return `
      <div style="display:flex;gap:1rem;align-items:flex-start;padding:0.9rem;background:var(--bg-2);border-radius:var(--r-md)">
        <div style="width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--bg-3);flex-shrink:0;border:1px solid var(--line)">
          <img src="${esc(avatar)}" alt="${esc(bot.name)}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:0.6rem;min-width:0">
          <div>
            <label style="display:block;font-size:0.7rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.25rem">显示名称</label>
            <input type="text" class="input bot-name-input" data-id="${esc(bot.id)}" value="${esc(name)}">
          </div>
          <div>
            <label style="display:block;font-size:0.7rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.25rem">角色描述</label>
            <input type="text" class="input bot-role-input" data-id="${esc(bot.id)}" value="${esc(role)}">
          </div>
          <div style="display:flex;gap:1rem;font-size:0.72rem;color:var(--text-3);font-family:var(--font-mono)">
            <span>ID: ${esc(bot.id)}</span>
            <span>模型: ${esc(bot.model)}</span>
          </div>
        </div>
      </div>`;
    }).join('');

    const gw=document.getElementById('gw-status-txt');
    if(gw){
      if(data.gatewayOnline) gw.innerHTML='<span style="color:var(--ok)">● 接通</span>';
      else gw.innerHTML='<span style="color:var(--err)">● 断线</span>';
    }
  }catch(e){
    el.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>${esc(e.message)}</div>`;
  }
}

async function saveAllBots(){
  const msg=document.getElementById('bot-save-msg');
  const bots=botsData.map(b=>{
    const n=document.querySelector(`.bot-name-input[data-id="${b.id}"]`);
    const r=document.querySelector(`.bot-role-input[data-id="${b.id}"]`);
    return{id:b.id,name:n?n.value.trim():b.name,role:r?r.value.trim():b.role};
  });
  try{
    const res=await fetch('/api/settings/bots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bots})});
    const data=await res.json();
    if(data.ok)msg.innerHTML='<span style="color:var(--ok)">✓ 保存成功</span>';
    else msg.innerHTML=`<span style="color:var(--err)">✗ ${esc(data.error||'保存失败')}</span>`;
  }catch(e){
    msg.innerHTML=`<span style="color:var(--err)">✗ ${esc(e.message)}</span>`;
  }
  setTimeout(()=>{msg.innerHTML='';},3000);
}

function fmtNum(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n);}

async function loadUsage(){
  const el=document.getElementById('usage-panel');
  el.innerHTML='<div class="loading">载入中…</div>';
  try{
    const data=await fetch('/api/usage').then(r=>r.json());
    if(data.notConnected){
      el.innerHTML=`
        <div style="padding:1rem 1.2rem;background:rgba(242,185,75,0.08);border-left:3px solid var(--warn);border-radius:0 var(--r-sm) var(--r-sm) 0">
          <div style="color:var(--warn);font-weight:600;margin-bottom:0.4rem">⚠ Gateway 未对接 Token 用量接口</div>
          <div style="font-size:0.85rem;color:var(--text-2);line-height:1.6">${esc(data.reason||'Gateway 未暴露 /api/usage')}</div>
          <div style="font-size:0.8rem;color:var(--text-3);margin-top:0.7rem;padding-top:0.7rem;border-top:1px solid var(--line)">
            对接指引见 <a href="https://github.com" style="color:var(--accent-2)">PROJECT.md §7.6</a>（需要 OpenClaw gateway 实现 <code>GET /api/usage</code>，返回含 <code>totalTokens / todayTokens / models[] / bots[]</code> 的结构）
          </div>
        </div>`;
      return;
    }
    const u=data.usage||{};
    const models=u.models||[];
    el.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.2rem">
        <div><div class="stat-label">总用量</div><div class="stat-value" style="font-size:1.8rem">${fmtNum(u.totalTokens||0)}</div></div>
        <div><div class="stat-label">今日</div><div class="stat-value" style="font-size:1.8rem;color:var(--accent-2)">${fmtNum(u.todayTokens||0)}</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.8rem">
        ${models.map(m=>`
          <div>
            <div style="display:flex;justify-content:space-between;margin-bottom:0.35rem;font-size:0.82rem">
              <span>${esc(m.model)}</span>
              <span style="color:var(--text-3);font-family:var(--font-mono)">${fmtNum(m.tokens)} · ${m.pct}%</span>
            </div>
            <div class="progress"><div class="progress-fill" style="width:${m.pct}%"></div></div>
          </div>`).join('')}
      </div>`;
  }catch(e){
    el.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>${esc(e.message)}</div>`;
  }
}

document.addEventListener('DOMContentLoaded',()=>{loadBots();loadUsage();});
</script>
</body>
</html>
