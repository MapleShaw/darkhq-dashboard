<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老巢 · 堂口</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 共享的 SVG 渐变定义 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e04850" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e04850" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <aside class="rail" data-active="dashboard"></aside>

  <div>
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">老巢</h1>
        <span class="topbar-sub">话事厅 · Darknet Operations</span>
      </div>
      <div class="topbar-right">
        <div class="status-chip" id="gateway-status">
          <span class="dot"></span><span>接线中…</span>
        </div>
        <span class="clock" id="clock">—</span>
        <a href="/auth/logout" style="font-size:0.72rem;color:var(--text-3);text-decoration:none;margin-left:0.5rem;opacity:0.7" title="登出">登出</a>
      </div>
    </header>

    <main class="page">
      <div class="page-header">
        <div>
          <h2 class="page-title">堂口</h2>
          <p class="page-desc">班底实时状况与当日要闻</p>
        </div>
        <button class="btn ghost sm" onclick="loadAll()">↻ 更新</button>
      </div>

      <section class="stat-grid">
        <div class="stat"><div class="stat-label">班底规模</div><div class="stat-value" id="sum-total">—</div><div class="stat-sub">位兄弟</div></div>
        <div class="stat"><div class="stat-label">在场</div><div class="stat-value" id="sum-online">—</div><div class="stat-sub" id="sum-online-sub">探线中…</div></div>
        <div class="stat"><div class="stat-label">日程</div><div class="stat-value" id="sum-cron">—</div><div class="stat-sub">条例牌</div></div>
        <div class="stat"><div class="stat-label">最新风声</div><div class="stat-value small" id="sum-signal-score">—</div><div class="stat-sub" id="sum-signal-time">探听中…</div></div>
      </section>

      <div class="main-grid">
        <div class="main-col">

          <section class="card">
            <div class="card-title">
              班底名册
              <span class="meta" id="bot-count">—</span>
            </div>
            <div class="bot-card-grid" id="bot-grid">
              <div class="loading">点名中…</div>
            </div>
          </section>

          <section class="card">
            <div class="card-title">
              日程
              <a href="/cron.html" class="meta">睇例牌 →</a> · <a href="/task-runs.html" class="meta">任务流水 →</a>
            </div>
            <div class="cron-list" id="cron-preview">
              <div class="loading">载入中…</div>
            </div>
          </section>

          <section class="card">
            <div class="card-title">
              风声
              <a href="/signals.html" class="meta">睇全部 →</a>
            </div>
            <div class="signal-grid" id="signal-preview">
              <div class="loading">探听中…</div>
            </div>
          </section>

        </div>

        <div class="side-col">

          <!-- ① 心跳主卡 -->
          <section class="card card-accent">
            <div class="card-title">
              线路心跳
              <span class="meta" id="hb-updated">—</span>
            </div>
            <div class="heartbeat-stat">
              <span class="num" id="hb-latency">—</span>
              <span class="unit">ms</span>
              <span class="trend" id="hb-trend">—</span>
            </div>
            <svg class="sparkline" id="hb-spark" viewBox="0 0 200 48" preserveAspectRatio="none"></svg>
            <div class="hb-meta">
              <div class="hb-meta-row"><span class="key">状态</span><span class="val" id="hb-status">—</span></div>
              <div class="hb-meta-row"><span class="key">运行时长</span><span class="val" id="hb-uptime">—</span></div>
              <div class="hb-meta-row"><span class="key">主机</span><span class="val" id="hb-host">—</span></div>
            </div>
          </section>

          <!-- ② Token 用量 -->
          <section class="card">
            <div class="card-title">
              Token 用量
              <div style="display:flex;align-items:center;gap:0.6rem">
                <button class="receipt-btn" id="receipt-btn" onclick="showReceipt()" title="打印小票">🧾 打单</button>
                <a href="/settings.html" class="meta">详情 →</a>
              </div>
            </div>
            <div class="token-mini" id="token-mini">
              <div class="loading">载入中…</div>
            </div>
          </section>

          <!-- ③ 系统简信息 -->
          <section class="card">
            <div class="card-title">系统</div>
            <div class="info-list">
              <div class="info-item"><span class="label">版本</span><span class="value" id="sys-version">v—</span></div>
              <div class="info-item"><span class="label">域名</span><span class="value">darkhq.indiehacker.fun</span></div>
              <div class="info-item"><span class="label">证书</span><span class="value" id="sys-certificate">读取中…</span></div>
            </div>
          </section>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="rail.js"></script>
<script src="app.js"></script>
<!-- ── Receipt Modal ─────────────────────────────────── -->
<div class="receipt-overlay" id="receipt-overlay" onclick="closeReceipt(event)">
  <div class="receipt-modal">
    <div class="receipt-printer-light"></div>
    <pre class="receipt-paper" id="receipt-paper"></pre>
    <div class="receipt-actions" id="receipt-actions" style="display:none">
      <button onclick="copyReceipt()">复制</button>
      <button onclick="document.getElementById('receipt-overlay').classList.remove('open');document.getElementById('receipt-actions').style.display='none'">关闭</button>
    </div>
  </div>
</div>
</body>
</html>
