<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⏰ 定时任务 · 老巢控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanline"></div>

<header class="hdr">
  <div class="hdr-left">
    <span class="hdr-icon">🏴‍☠️</span>
    <div>
      <h1 class="hdr-title">老巢控制台</h1>
      <span class="hdr-sub">DARKNET OPERATIONS CENTER</span>
    </div>
  </div>
  <div class="hdr-right">
    <nav class="hdr-nav">
      <a class="nav-link" href="/">⌂ 主页</a>
      <a class="nav-link active" href="/cron.html">⏰ 定时任务</a>
      <a class="nav-link" href="/signals.html">📡 创意雷达</a>
      <a class="nav-link" href="/settings.html">⚙️ 设置</a>
    </nav>
    <div class="clock" id="clock"></div>
  </div>
</header>

<nav class="breadcrumb">
  <a href="/">老巢控制台</a>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-current">⏰ 定时任务</span>
</nav>

<main class="layout">
  <section class="section">
    <div class="section-header">
      <h2 class="section-title"><span class="accent">◈</span> 定时任务 · Cron Jobs</h2>
      <button class="refresh-btn" onclick="loadCronFull()">↺ 刷新</button>
    </div>

    <!-- stats row -->
    <div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap">
      <div class="summary-card" style="flex:1;min-width:140px;padding:0.8rem 1rem;">
        <div class="summary-label">总任务数</div>
        <div class="summary-value" id="cron-total" style="font-size:1.4rem">—</div>
      </div>
      <div class="summary-card" style="flex:1;min-width:140px;padding:0.8rem 1rem;">
        <div class="summary-label">已启用</div>
        <div class="summary-value" id="cron-enabled-count" style="font-size:1.4rem;color:var(--green)">—</div>
      </div>
      <div class="summary-card" style="flex:1;min-width:140px;padding:0.8rem 1rem;">
        <div class="summary-label">最近成功</div>
        <div class="summary-value" id="cron-success-count" style="font-size:1.4rem;color:var(--cyan)">—</div>
      </div>
    </div>

    <div id="cron-full-list" style="display:flex;flex-direction:column;gap:0.7rem">
      <div class="loading">载入中...</div>
    </div>
  </section>
</main>

<footer class="footer">
  <span>老巢控制台 · 仅限内部访问 · OpenClaw Dashboard v2.0</span>
</footer>

<script>
// Clock
function updateClock(){const n=new Date();const e=document.getElementById('clock');if(e)e.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
setInterval(updateClock,1000);updateClock();

function formatTime(iso){
  if(!iso)return'—';
  try{const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}catch(e){return iso;}
}
function statusLabel(s){
  const map={success:['✓ 成功','status-success'],ok:['✓ 成功','status-success'],failed:['✗ 失败','status-failed'],error:['✗ 失败','status-failed'],running:['⟳ 运行中','status-running'],unknown:['— 未知','status-unknown']};
  return map[(s||'unknown').toLowerCase()]||['— 未知','status-unknown'];
}

// Mock run history generator
function mockRuns(job) {
  const statuses = ['success','success','success','failed','unknown'];
  const results = [];
  for(let i=0;i<3;i++){
    const st = statuses[Math.floor(Math.random()*statuses.length)];
    const d  = new Date(Date.now() - (i+1)*24*3600*1000);
    results.push({status:st, time:d.toISOString()});
  }
  return results;
}

function runDotColor(st){
  return {success:'var(--green)',ok:'var(--green)',failed:'var(--red)',error:'var(--red)',running:'var(--cyan)'}[st]||'var(--text-dim)';
}

async function loadCronFull(){
  const list=document.getElementById('cron-full-list');
  list.innerHTML='<div class="loading">载入中...</div>';
  try{
    const res=await fetch('/api/cron');
    const data=await res.json();
    const jobs=data.jobs||[];

    document.getElementById('cron-total').textContent=jobs.length;
    document.getElementById('cron-enabled-count').textContent=jobs.filter(j=>j.enabled!==false).length;
    document.getElementById('cron-success-count').textContent=jobs.filter(j=>['success','ok'].includes((j.status||'').toLowerCase())).length;

    if(jobs.length===0){
      list.innerHTML='<div class="empty-state"><span class="empty-icon">⏰</span>暂无任务</div>';
      return;
    }

    list.innerHTML = jobs.map((job,i)=>{
      const [statusText,statusClass]=statusLabel(job.status);
      const enabled=job.enabled!==false;
      const runs=mockRuns(job);
      // Build cron expression (mock)
      const [h,m]=(job.schedule||'00:00').split(':');
      const cronExpr=`${m} ${h} * * *`;
      return `
      <div class="cron-row-v2" id="cron-row-${i}" onclick="toggleCronRow(${i})">
        <div class="cron-row-main">
          <div class="cron-name" style="display:flex;align-items:center;gap:0.5rem">
            <span style="font-size:1.1rem">${job.emoji||'⚙️'}</span>
            <span style="font-family:var(--font-cn)">${job.name}</span>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
            <span class="cron-status ${statusClass}">${statusText}</span>
            <span class="cron-enabled-badge ${enabled?'badge-enabled':'badge-disabled'}">${enabled?'ENABLED':'DISABLED'}</span>
          </div>
          <div class="cron-time cron-row-time">
            <span>${formatTime(job.lastRun)}</span>
          </div>
          <div class="cron-time cron-row-time">
            <span class="next">▶ ${formatTime(job.nextRun)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem">
            <span style="font-size:0.7rem;color:var(--yellow);letter-spacing:1px">${job.schedule}</span>
            <span class="cron-chevron">▶</span>
          </div>
        </div>
        <div class="cron-row-detail" id="cron-detail-${i}">
          <div class="cron-row-detail-inner">
            <div class="cron-detail-meta">
              <div class="cron-detail-field">
                <label>任务 ID</label>
                <code>${job.id||'—'}</code>
              </div>
              <div class="cron-detail-field">
                <label>Cron 表达式</label>
                <code>${cronExpr}</code>
              </div>
              <div class="cron-detail-field">
                <label>状态</label>
                <span>${enabled?'已启用':'已禁用'}</span>
              </div>
              <div class="cron-detail-field">
                <label>下次运行</label>
                <span>${formatTime(job.nextRun)}</span>
              </div>
            </div>
            <div class="cron-run-history">
              <div class="cron-run-history-title">最近 3 次运行记录</div>
              ${runs.map(r=>`
                <div class="run-item">
                  <span class="run-dot" style="background:${runDotColor(r.status)}"></span>
                  <span>${formatTime(r.time)}</span>
                  <span style="color:${runDotColor(r.status)}">${r.status}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    list.innerHTML=`<div class="empty-state"><span class="empty-icon">⚠️</span>加载失败：${e.message}</div>`;
  }
}

function toggleCronRow(i){
  const row=document.getElementById('cron-row-'+i);
  if(row) row.classList.toggle('open');
}

document.addEventListener('DOMContentLoaded', loadCronFull);
</script>
</body>
</html>
