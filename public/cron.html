<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程 · 老巢</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail" data-active="cron"></aside>

  <div>
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="topbar-title">老巢</h1>
        <span class="topbar-sub">话事厅 · Darknet Operations</span>
      </div>
      <div class="topbar-right"><span class="clock" id="clock">—</span></div>
    </header>

    <main class="page">
      <div class="page-header">
        <div>
          <h2 class="page-title">日程</h2>
          <p class="page-desc">例牌与定时差事的出勤记录</p>
        </div>
        <button class="btn ghost sm" onclick="loadCronFull()">↻ 更新</button>
      </div>

      <section class="stat-grid">
        <div class="stat"><div class="stat-label">总数</div><div class="stat-value" id="cron-total">—</div><div class="stat-sub">条例牌</div></div>
        <div class="stat"><div class="stat-label">在跑</div><div class="stat-value" id="cron-enabled">—</div><div class="stat-sub ok">运转中</div></div>
        <div class="stat"><div class="stat-label">搞掂</div><div class="stat-value" id="cron-success">—</div><div class="stat-sub">上一轮</div></div>
        <div class="stat"><div class="stat-label">失手</div><div class="stat-value" id="cron-failed">—</div><div class="stat-sub err">要跟进</div></div>
      </section>

      <section class="card">
        <div class="card-title">全部例牌 <span class="meta">点行展开睇近 10 次出勤</span></div>
        <div class="cron-list" id="cron-full"><div class="loading">载入中…</div></div>
      </section>
    </main>
  </div>
</div>

<script src="rail.js"></script>
<script>
function updateClock(){const n=new Date();const e=document.getElementById('clock');if(e)e.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');}
setInterval(updateClock,1000);updateClock();

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtTime(iso){if(!iso)return'—';try{const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}catch(e){return iso;}}
function fmtDur(ms){if(ms==null)return'—';if(ms<1000)return ms+'ms';return(ms/1000).toFixed(1)+'s';}
function statusBadge(s){const key=(s||'unknown').toLowerCase();const map={success:['ok','搞掂'],ok:['ok','搞掂'],failed:['err','失手'],error:['err','失手'],running:['warn','开工中'],unknown:['dim','未知']};const[cls,label]=map[key]||['dim','未知'];return`<span class="badge ${cls}">${label}</span>`;}
function runDotColor(st){return{success:'var(--ok)',ok:'var(--ok)',failed:'var(--err)',error:'var(--err)',running:'var(--warn)'}[st]||'var(--text-3)';}

let jobsCache=[];

async function loadCronFull(){
  const list=document.getElementById('cron-full');
  list.innerHTML='<div class="loading">载入中…</div>';
  try{
    const data=await fetch('/api/cron').then(r=>r.json());
    const jobs=data.jobs||[];
    jobsCache=jobs;

    document.getElementById('cron-total').textContent=jobs.length;
    document.getElementById('cron-enabled').textContent=jobs.filter(j=>j.enabled!==false).length;
    document.getElementById('cron-success').textContent=jobs.filter(j=>['success','ok'].includes((j.status||'').toLowerCase())).length;
    document.getElementById('cron-failed').textContent=jobs.filter(j=>['failed','error'].includes((j.status||'').toLowerCase())).length;

    if(!jobs.length){
      list.innerHTML='<div class="empty"><span class="empty-icon">⏰</span>冇例牌</div>';
      return;
    }

    list.innerHTML=`
      <div class="cron-head"><div>例牌</div><div>状态</div><div>上次</div><div>下次</div><div>时辰</div></div>
      ${jobs.map((job,i)=>{
        const[h,m]=(job.schedule||'00:00').split(':');
        const cronExpr=`${m} ${h} * * *`;
        return `
        <div class="cron-row" id="cron-row-${i}" onclick="toggleRow(${i},'${esc(job.id)}')">
          <div class="cron-name"><span class="emoji">${job.emoji||'⚙'}</span><span class="txt">${esc(job.name)}</span></div>
          <div>${statusBadge(job.status)}</div>
          <div class="cron-time">${fmtTime(job.lastRun)}</div>
          <div class="cron-time next">${fmtTime(job.nextRun)}</div>
          <div class="cron-schedule">${esc(job.schedule)}</div>
          <div class="cron-row-detail" onclick="event.stopPropagation()">
            <div class="cron-row-detail-inner">
              <div class="detail-field"><label>例牌 ID</label><code>${esc(job.id||'—')}</code></div>
              <div class="detail-field"><label>Cron 表达式</label><code>${cronExpr}</code></div>
              <div class="detail-field"><label>负责兄弟</label><span>${esc(job.botId||'—')}</span></div>
              <div class="detail-field"><label>是否在跑</label><span>${job.enabled!==false?'系':'否'}</span></div>
              <div class="detail-field" style="grid-column:1/-1">
                <label>近 10 次出勤</label>
                <div class="run-history" id="run-history-${i}"><div class="loading">载入中…</div></div>
              </div>
            </div>
          </div>
        </div>`;
      }).join('')}`;
  }catch(e){
    list.innerHTML=`<div class="empty"><span class="empty-icon">⚠</span>${esc(e.message)}</div>`;
  }
}

async function toggleRow(i, jobId){
  const row=document.getElementById('cron-row-'+i);
  if(!row) return;
  const willOpen=!row.classList.contains('open');
  row.classList.toggle('open');
  if(willOpen){
    const host=document.getElementById('run-history-'+i);
    if(host && host.dataset.loaded!=='1'){
      try{
        const data=await fetch(`/api/cron/${encodeURIComponent(jobId)}/runs`).then(r=>r.json());
        const runs=data.runs||[];
        if(!runs.length){
          host.innerHTML='<div class="run-item"><span style="color:var(--text-3)">未有出勤记录</span></div>';
        }else{
          host.innerHTML=runs.map((r,ri)=>`
            <details style="margin-bottom:0.35rem;border-bottom:1px dashed var(--line);padding-bottom:0.35rem">
              <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:0.6rem">
                <span class="run-dot" style="background:${runDotColor(r.status)}"></span>
                <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-2)">${fmtTime(r.startedAt)}</span>
                <span style="color:${runDotColor(r.status)};font-size:0.72rem">${esc(r.status)}</span>
                <span style="color:var(--text-3);font-size:0.72rem;margin-left:auto">${fmtDur(r.durationMs)}</span>
              </summary>
              ${r.output?`<div class="run-item-output">${esc(r.output)}</div>`:''}
            </details>`).join('');
        }
        host.dataset.loaded='1';
      }catch(e){
        host.innerHTML=`<div class="run-item" style="color:var(--err)">${esc(e.message)}</div>`;
      }
    }
  }
}

document.addEventListener('DOMContentLoaded',loadCronFull);
</script>
</body>
</html>
