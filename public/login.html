<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 · 老巢</title>
<link rel="icon" href="/avatars/logo.png">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-0: #0a0a0c;
  --bg-1: #111114;
  --bg-2: #17171c;
  --bg-3: #1e1e24;
  --text: #e6e6eb;
  --text-2: #9a9aa6;
  --text-3: #7e7e8e;
  --line: rgba(255,255,255,0.06);
  --line-2: rgba(255,255,255,0.10);
  --accent: #c8323a;
  --accent-2: #e04850;
  --accent-soft: rgba(200,50,58,0.14);
  --err: #e04850;
  --font: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
}
html { font-size: 15px; }
body {
  background:
    radial-gradient(ellipse 900px 600px at 85% -10%, rgba(200,50,58,0.16), transparent 60%),
    radial-gradient(ellipse 700px 500px at 10% 100%, rgba(123,30,45,0.10), transparent 55%),
    linear-gradient(180deg, #0c0a0d 0%, var(--bg-0) 40%, #0a0a0c 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  width: 100%;
  max-width: 360px;
  padding: 2rem;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.03) inset;
  position: relative;
  overflow: hidden;
}
.login-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(224,72,80,0.55), transparent);
}
.login-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.5rem;
}
.login-logo img {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--accent-soft);
  object-fit: cover;
}
.login-title {
  text-align: center;
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 0.3rem;
}
.login-sub {
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-3);
  margin-bottom: 1.75rem;
}
.login-error {
  background: rgba(224,72,80,0.1);
  border: 1px solid rgba(224,72,80,0.3);
  border-radius: var(--r-sm);
  padding: 0.6rem 0.9rem;
  font-size: 0.82rem;
  color: var(--err);
  margin-bottom: 1.25rem;
  display: none;
}
.login-error.show { display: block; }
.login-label {
  display: block;
  font-size: 0.75rem;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.5rem;
}
.login-input {
  width: 100%;
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 0.6rem 0.85rem;
  border-radius: var(--r-sm);
  font-size: 0.92rem;
  font-family: var(--font-mono);
  outline: none;
  transition: border-color 0.15s;
  margin-bottom: 1.25rem;
}
.login-input:focus { border-color: var(--accent); }
.login-btn {
  width: 100%;
  padding: 0.65rem;
  background: var(--accent);
  border: 1px solid var(--accent);
  color: #fff;
  border-radius: var(--r-sm);
  font-size: 0.9rem;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: background 0.15s;
}
.login-btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <img src="/avatars/logo.png" alt="老巢" onerror="this.style.fontSize='2rem';this.outerHTML='<span style=\'font-size:2rem\'>🏴☠️</span>'">
  </div>
  <div class="login-title">老巢</div>
  <div class="login-sub">Darknet Operations · 请验明身份</div>

  <div class="login-error" id="login-error">密码不对，兄弟。</div>

  <form method="POST" action="/auth/login">
    <label class="login-label" for="password">通行密语</label>
    <input
      class="login-input"
      type="password"
      id="password"
      name="password"
      placeholder="输入密码…"
      autocomplete="current-password"
      autofocus
    >
    <button class="login-btn" type="submit">进</button>
  </form>
</div>

<script>
// Show error if ?error=1
if (new URLSearchParams(location.search).get('error') === '1') {
  document.getElementById('login-error').classList.add('show');
}
</script>
</body>
</html>
